services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_doan
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Vui long khai bao MSSQL_SA_PASSWORD trong tep .env}"
    ports:
      - "1433:1433"
    volumes:
      - .:/data
      - mssql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  mssql_data:
    external: true
